[project]
name = "agentic-mannheim"
version = "0.1.0"
description = "Experimental Agentic Digital Twin of Mannheim"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.118.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = ["api", "domain", "digital_twin", "simulation", "agents", "decision", "policy"]
module-root = "src"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
